    <g transform="translate(450)"><rect width="205" height="64" rx="20" fill="#171d24" stroke="#303844"/><path d="M23 42c16-4 22-14 22-27-13 1-25 8-28 19 2 3 3 5 6 8z" fill="none" stroke="#ff6a00" stroke-width="4"/><text x="57" y="40" fill="#e9edf2">Low memory</text></g>
