<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">CloudWalk</title>
  <desc id="desc">Tiny native Android SoundCloud client</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111820"/>
      <stop offset="1" stop-color="#0a0d11"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9820"/>
      <stop offset="1" stop-color="#ff5a00"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>

  <rect width="1600" height="520" rx="34" fill="url(#bg)"/>
  <ellipse cx="150" cy="95" rx="210" ry="120" fill="#ff6500" opacity=".08" filter="url(#soft)"/>
  <ellipse cx="1435" cy="445" rx="260" ry="120" fill="#ff6500" opacity=".06" filter="url(#soft)"/>

