  <text x="452" y="270" fill="#b9c0c8" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="34">Tiny native Android SoundCloud client</text>

  <g transform="translate(452 320)" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="600">
    <g><rect width="185" height="64" rx="20" fill="#171d24" stroke="#303844"/><circle cx="31" cy="32" r="9" fill="#ff6a00"/><text x="52" y="40" fill="#e9edf2">Native UI</text></g>
